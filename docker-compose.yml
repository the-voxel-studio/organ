services:
  # ==========================================
  # BASES DE DONNÉES & CACHE
  # ==========================================
  database:
    image: mysql:8.0
    container_name: organ_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306" # Port standard MySQL
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: organ_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8080:80" # Interface web de la BDD sur http://localhost:8080
    depends_on:
      - database
    networks:
      - app_network

  valkey:
    image: valkey/valkey:7.2
    container_name: organ_valkey
    ports:
      - "6379:6379" # Port standard Redis/Valkey
    networks:
      - app_network

  # ==========================================
  # TEMPS RÉEL (MERCURE)
  # ==========================================
  mercure:
    image: dunglas/mercure
    container_name: organ_mercure
    environment:
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      SERVER_NAME: ':80' 
    ports:
      - "9090:80" # Hub Mercure sur http://localhost:9090
    networks:
      - app_network

  # ==========================================
  # EMAILS LOCAUX (MAILPIT)
  # ==========================================
  mailpit:
    image: axllent/mailpit
    container_name: organ_mailpit
    ports:
      - "8025:8025" # Interface Web pour lire les mails: http://localhost:8025
      - "1025:1025" # Port SMTP (celui que Symfony utilisera en local)
    networks:
      - app_network

  # ==========================================
  # BACKEND (API SYMFONY)
  # ==========================================
  api-php:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: organ_api_php
    volumes:
      - ./api:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - app_network

  api-nginx:
    image: nginx:alpine
    container_name: organ_api_nginx
    ports:
      - "8001:80" # http://localhost:8001
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-php
    networks:
      - app_network

  # ==========================================
  # FRONTEND (SYMFONY / JS)
  # ==========================================
  front-php:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: organ_front_php
    volumes:
      - ./front:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - app_network

  front-nginx:
    image: nginx:alpine
    container_name: organ_front_nginx
    ports:
      - "8000:80" # http://localhost:8000
    volumes:
      - ./front:/var/www/html
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - front-php
    networks:
      - app_network

  front-tailwind-watch:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: organ_front_tailwind
    volumes:
      - ./front:/var/www/html
    working_dir: /var/www/html
    command: php bin/console tailwind:build --watch
    restart: unless-stopped
    depends_on:
      - front-php
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge