services:
  # ==========================================
  # BASES DE DONNÉES & CACHE
  # ==========================================
  database:
    platform: linux/amd64
    image: mysql:8.0
    container_name: organ_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    ports:
      - "3306:3306" # Port standard MySQL
    networks:
      - app_network

  phpmyadmin:
    platform: linux/amd64
    image: phpmyadmin/phpmyadmin
    container_name: organ_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8080:80" # Interface web de la BDD sur http://localhost:8080
    depends_on:
      - database
    networks:
      - app_network

  valkey:
    platform: linux/amd64
    image: valkey/valkey:7.2
    container_name: organ_valkey
    ports:
      - "6379:6379" # Port standard Redis/Valkey
    networks:
      - app_network

  # ==========================================
  # TEMPS RÉEL (MERCURE)
  # ==========================================
  mercure:
    platform: linux/amd64
    image: dunglas/mercure
    container_name: organ_mercure
    environment:
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_CORS_ALLOWED_ORIGINS: '*'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
      SERVER_NAME: ':80' 
    ports:
      - "9090:80" # Hub Mercure sur http://localhost:9090
    networks:
      - app_network

  # ==========================================
  # NOSQL DATABASE (MONGODB)
  # ==========================================
  mongodb:
    platform: linux/amd64
    image: mongo:7.0
    container_name: organ_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017" # Port standard MongoDB
    networks:
      - app_network

  # ==========================================
  # BACKEND (API SYMFONY)
  # ==========================================
  api-php:
    platform: linux/amd64
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: organ_api_php
    command: sh -c "php bin/console doctrine:mongodb:schema:create --no-interaction || true; php-fpm"
    environment:
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    volumes:
      - ./api:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    networks:
      - app_network
    depends_on:
      - database
      - mongodb
      - valkey
  api-nginx:
    platform: linux/amd64
    image: nginx:alpine
    container_name: organ_api_nginx
    ports:
      - "8001:80" # http://localhost:8001
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-php
      - mongodb
    networks:
      - app_network

  # ==========================================
  # FRONTEND (SYMFONY / JS)
  # ==========================================
  front-php:
    platform: linux/amd64
    build: 
      context: ./front_php
      dockerfile: Dockerfile
    container_name: organ_front_php
    volumes:
      - ./front_php:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    networks:
      - app_network

  front-nginx:
    platform: linux/amd64
    image: nginx:alpine
    container_name: organ_front_nginx
    ports:
      - "8000:80" # http://localhost:8000
    volumes:
      - ./front_php:/var/www/html
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - front-php
      - api-nginx
      - mercure
    networks:
      - app_network

  front-tailwind-watch:
    platform: linux/amd64
    build: 
      context: ./front_php
      dockerfile: Dockerfile
    container_name: organ_front_tailwind
    volumes:
      - ./front_php:/var/www/html
    working_dir: /var/www/html
    command: php bin/console tailwind:build --watch
    restart: unless-stopped
    depends_on:
      - front-php
    networks:
      - app_network

  # ==========================================
  # FRONTEND (ANGULAR)
  # ==========================================
  front-angular:
    platform: linux/amd64
    build:
      context: ./front_angular
      dockerfile: Dockerfile
    container_name: organ_front_angular
    ports:
      - "4200:4200" # http://localhost:4200
    volumes:
      - ./front_angular:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && ng serve --host 0.0.0.0 --poll 2000"
    depends_on:
      - api-nginx
    networks:
      - app_network

volumes:
  db_data:
  mongo_data:

networks:
  app_network:
    driver: bridge