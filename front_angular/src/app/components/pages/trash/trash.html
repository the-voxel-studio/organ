<div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
  <header class="mb-12">
    <h1 class="text-4xl font-black text-black mb-2 flex items-center gap-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-10 h-10 text-red-500">
        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
      </svg>
      Corbeille globale
    </h1>
    <p class="text-gray-500 font-medium">Retrouvez les projets supprimés dont vous êtes le propriétaire administratif.</p>
  </header>

  @if (isLoading()) {
    <!-- Trash Shimmer -->
    <div class="space-y-4">
      @for (i of [1, 2, 3]; track i) {
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-2xs flex items-center justify-between gap-4">
          <div class="flex items-center gap-4 flex-1">
            <app-shimmer width="48px" height="48px" className="rounded-2xl"></app-shimmer>
            <div class="space-y-2 flex-1">
              <app-shimmer width="50%" height="20px" className="rounded"></app-shimmer>
              <app-shimmer width="30%" height="12px" className="rounded"></app-shimmer>
            </div>
          </div>
          <div class="flex gap-2">
            <app-shimmer width="100px" height="40px" className="rounded-xl"></app-shimmer>
            <app-shimmer width="100px" height="40px" className="rounded-xl"></app-shimmer>
          </div>
        </div>
      }
    </div>
  } @else if (errorMessage()) {
    <!-- Error State -->
    <div class="bg-red-50 border border-red-200 text-red-800 rounded-3xl p-6 text-center max-w-lg mx-auto">
      <h3 class="font-bold mb-2">Erreur</h3>
      <p class="text-sm text-red-600 mb-4">{{ errorMessage() }}</p>
      <button type="button" (click)="loadTrashedProjects()" class="px-6 py-2 bg-black text-white font-bold rounded-xl hover:bg-black/90 transition-all cursor-pointer">
        Réessayer
      </button>
    </div>
  } @else {
    <!-- Delegate to sub-component -->
    <app-trashed-projects
      [projects]="trashedProjects()"
      (projectsChanged)="loadTrashedProjects()">
    </app-trashed-projects>
  }
</div>
