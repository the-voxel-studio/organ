<div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <!-- Back Link & Title -->
  <div class="mb-8">
    <a [routerLink]="['/organ', projectUuid, organUuid]"
       class="text-sm font-medium transition-colors flex items-center gap-2 hover:opacity-80 cursor-pointer"
       [style.color]="initialOrganData?.highlightColor || '#FF7EB6'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Retour à l'organ
    </a>
    <h1 class="text-4xl font-bold text-gray-900 mt-4">
      Paramètres de l'organ
    </h1>
  </div>

  @if (isLoading()) {
    <app-spinner [color]="projectColor" size="lg" text="Chargement de la configuration..." [fullscreen]="true"></app-spinner>
  } @else {
    <app-organ-form
      [projectColor]="projectColor"
      [projectTitle]="projectTitle"
      [isEdit]="true"
      [isSubmitting]="isSubmitting()"
      [errorMessage]="errorMessage()"
      [loadingText]="loadingText()"
      [availablePermissions]="availablePermissions"
      [organPermissions]="organPermissions"
      [taskPermissions]="taskPermissions"
      [interactionPermissions]="interactionPermissions"
      [presets]="presets"
      [projectMembers]="projectMembers"
      [initialOrganData]="initialOrganData"
      [initialRoles]="initialRoles"
      [initialMembers]="initialMembers"
      [canEditInfo]="canEditInfo()"
      [canManageRoles]="canManageRoles()"
      [canManageMembers]="canManageMembers()"
      (submitForm)="onSubmitForm($event)"
      (cancel)="onCancel()">
    </app-organ-form>

    <app-organ-danger-zone
      [projectUuid]="projectUuid!"
      [organUuid]="organUuid!"
      [organTitle]="initialOrganData?.title"
      [canDelete]="canDeleteOrgan()"
      [highlightColor]="initialOrganData?.highlightColor"
      (loadingStateChanged)="isSubmitting.set($event.loading); loadingText.set($event.text)"
      (errorOccurred)="errorMessage.set($event)">
    </app-organ-danger-zone>
  }
</div>

<!-- LOADING OVERLAY -->
@if (isSubmitting()) {
  <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white/60 backdrop-blur-md transition-all duration-300">
    <div class="relative">
      <div class="w-24 h-24 border-4 rounded-full animate-spin" [style.border-color]="projectColor + '1a'" [style.border-top-color]="projectColor"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-3xl">🏗️</span>
      </div>
    </div>
    <p class="mt-8 text-xl font-black text-gray-900 tracking-tight animate-pulse">
      {{ loadingText() }}
    </p>
    <p class="mt-2 text-sm text-gray-400 font-bold uppercase tracking-widest">Étape de configuration finale</p>
  </div>
}
