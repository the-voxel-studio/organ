<section class="h-full">
  <h2 class="text-xl font-bold text-black mb-8 flex items-center gap-3">
    <div class="p-2 bg-sky-50 rounded-xl text-sky-600">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9-3.75h.008v.008H12V8.25z"/>
      </svg>
    </div>
    À propos du projet
  </h2>
  <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 h-fit">
    <p class="text-gray-600 leading-relaxed font-medium">
      {{ description || 'Aucune description fournie.' }}
    </p>
    <div class="mt-8 pt-8 border-t border-gray-50">
      <div class="flex items-center justify-between text-[10px] font-black uppercase tracking-widest text-gray-400">
        <span>Créé le</span>
        <span class="text-gray-900">{{ formatDate(createdAt) }}</span>
      </div>
    </div>
  </div>
</section>
