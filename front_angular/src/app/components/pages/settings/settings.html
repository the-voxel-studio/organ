<div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
  <header class="mb-10">
    <h1 class="text-3xl font-black text-black mb-2">Paramètres</h1>
    <p class="text-gray-500 font-medium">Gérez vos informations personnelles et vos préférences de compte.</p>
  </header>

  <div class="grid grid-cols-1 gap-8">

    <!-- Profil Component -->
    <app-settings-profile></app-settings-profile>

    <!-- Connexion & Sécurité Section -->
    <section class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-8">
        <div class="flex items-center gap-4 mb-8">
          <div class="p-3 bg-highlight/10 rounded-2xl text-highlight">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-black">Sécurité</h2>
            <p class="text-sm text-gray-500 font-medium">Gérez votre mot de passe et vos connexions tierces.</p>
          </div>
        </div>

        <div class="space-y-8">
          <!-- Google Link Component -->
          <app-settings-google-link></app-settings-google-link>

          <!-- Password Component -->
          <app-settings-password></app-settings-password>
        </div>
      </div>
    </section>

    <!-- Connections Component -->
    <app-settings-connections></app-settings-connections>

    <!-- Danger Zone Component -->
    <app-settings-danger-zone></app-settings-danger-zone>

  </div>
</div>
