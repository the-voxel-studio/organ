<!-- Password Form (Only displayed if not exclusively authenticated by Google) -->
<ng-container *ngIf="!currentUser()?.authWithGoogle">
  <div class="h-px bg-gray-50 my-6"></div>

  <div class="px-2">
    <h3 class="font-bold text-black mb-4">Modifier le mot de passe</h3>
    
    <!-- Password Alert Zones -->
    <div *ngIf="passwordError" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm font-bold rounded-r-xl">
      <span>{{ passwordError }}</span>
    </div>
    <div *ngIf="passwordSuccess" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm font-bold rounded-r-xl">
      <span>{{ passwordSuccess }}</span>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmitPassword()" class="space-y-4 max-w-md">
      <div class="relative">
        <label for="current_password" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Mot de passe actuel</label>
        <div class="relative">
          <input [type]="showCurrentPassword ? 'text' : 'password'" formControlName="currentPassword" id="current_password" class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum transition-all outline-none font-medium">
          <button type="button" (click)="showCurrentPassword = !showCurrentPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black transition-colors p-2 cursor-pointer">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="relative">
        <label for="new_password" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Nouveau mot de passe</label>
        <div class="relative">
          <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" id="new_password" class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum transition-all outline-none font-medium">
          <button type="button" (click)="showNewPassword = !showNewPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black transition-colors p-2 cursor-pointer">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" [disabled]="passwordForm.invalid || isPasswordLoading" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition-all flex items-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-wait">
        <svg *ngIf="isPasswordLoading" class="animate-spin h-4 w-4 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Mettre à jour le mot de passe
      </button>
    </form>
  </div>
</ng-container>
