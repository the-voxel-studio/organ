<!-- Sessions Area -->
<section class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="p-8">
    <div class="flex items-center gap-4 mb-8">
      <div class="p-3 bg-bubblegum/10 rounded-2xl text-bubblegum">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/>
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-black">Sessions actives</h2>
        <p class="text-sm text-gray-500 font-medium">Appareils actuellement connectés à votre compte.</p>
      </div>
    </div>

    <div class="space-y-4">
      <div *ngIf="isConnectionsLoading()" class="space-y-4">
        <div *ngFor="let i of [1, 2]" class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100">
          <div class="flex items-center gap-4 flex-1">
            <div class="p-2.5 bg-white rounded-xl border border-gray-100 shadow-sm shrink-0">
              <app-shimmer width="20px" height="20px" className="rounded"></app-shimmer>
            </div>
            <div class="space-y-2 flex-1">
              <app-shimmer width="160px" height="16px" className="rounded"></app-shimmer>
              <app-shimmer width="120px" height="12px" className="rounded"></app-shimmer>
            </div>
          </div>
        </div>
      </div>

      <ng-container *ngIf="!isConnectionsLoading()">
        <div *ngFor="let conn of connections()" class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100 mb-3 group transition-all hover:bg-white hover:shadow-sm">
          <div class="flex items-center gap-4">
            <div class="p-2.5 bg-white rounded-xl text-gray-400 border border-gray-100 shadow-sm group-hover:text-highlight transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <p class="font-bold text-black text-sm">{{ conn.deviceName }} • {{ conn.browserName }}</p>
                <span *ngIf="conn.isCurrent" class="px-2 py-0.5 bg-green-100 text-green-700 text-[10px] font-black uppercase tracking-widest rounded-md">Actuelle</span>
              </div>
              <p class="text-xs text-gray-500 font-medium">
                {{ conn.location }} • <span class="text-gray-400">{{ conn.ipAddress }}</span>
              </p>
              <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider font-bold">
                Dernière activité : {{ formatRelativeDate(conn.lastUsedAt) }}
              </p>
            </div>
          </div>
          
          <button type="button" 
                  (click)="onRevokeConnection(conn)"
                  class="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all md:opacity-0 md:group-hover:opacity-100 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <p *ngIf="connections().length === 0" class="text-sm text-gray-500 italic p-4">Aucune session active</p>
      </ng-container>
    </div>
  </div>
</section>

<!-- Generic Confirmation Modal for Session Invalidation -->
<app-confirmation-modal
  [isOpen]="isDisconnectModalOpen"
  [title]="'Déconnecter l\'appareil ?'"
  [message]="'Cet appareil sera immédiatement déconnecté. Vous devrez vous reconnecter pour accéder de nouveau à votre compte sur ce terminal.'"
  [confirmLabel]="'Déconnecter'"
  [cancelLabel]="'Annuler'"
  [type]="'primary'"
  [isLoading]="isDisconnectLoading"
  (confirm)="confirmRevokeConnection()"
  (cancel)="isDisconnectModalOpen = false">
</app-confirmation-modal>
