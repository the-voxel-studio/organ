<!-- Information Personnelle -->
<section class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="p-8">
    <div class="flex items-center gap-4 mb-8">
      <div class="p-3 bg-bubblegum/10 rounded-2xl text-bubblegum">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-black">Profil</h2>
        <p class="text-sm text-gray-500 font-medium">Vos informations visibles sur la plateforme.</p>
      </div>
    </div>

    <!-- Alert Zones -->
    <div *ngIf="profileError" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm font-bold rounded-r-xl">
      <span>{{ profileError }}</span>
    </div>
    <div *ngIf="profileSuccess" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm font-bold rounded-r-xl">
      <span>{{ profileSuccess }}</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmitProfile()" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label for="firstName" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Prénom</label>
          <input type="text" formControlName="firstName" id="firstName" 
                 class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum focus:ring-4 focus:ring-bubblegum/10 transition-all outline-none font-medium">
        </div>
        <div>
          <label for="lastName" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Nom</label>
          <input type="text" formControlName="lastName" id="lastName" 
                 class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum focus:ring-4 focus:ring-bubblegum/10 transition-all outline-none font-medium">
        </div>
      </div>

      <div>
        <label for="email" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Adresse E-mail</label>
        <ng-container *ngIf="currentUser()?.authWithGoogle; else emailEditable">
          <div class="relative group">
            <input type="email" [value]="profileForm.get('email')?.value" readonly class="w-full px-5 py-4 bg-gray-100 border border-gray-200 rounded-2xl text-gray-500 cursor-not-allowed font-medium outline-none">
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 0 0-4.5 4.5V9H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-.5V5.5A4.5 4.5 0 0 0 10 1Zm3 8V5.5a3 3 0 1 0-6 0V9h6Z" clip-rule="evenodd"/>
              </svg>
            </div>
          </div>
          <p class="mt-2 text-[10px] font-bold text-highlight uppercase tracking-wider flex items-center gap-1.5">
            <span class="w-1 h-1 bg-highlight rounded-full"></span>
            Géré par Google : L'adresse e-mail ne peut pas être modifiée ici.
          </p>
        </ng-container>
        <ng-template #emailEditable>
          <input type="email" formControlName="email" id="email" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum focus:ring-4 focus:ring-bubblegum/10 transition-all outline-none font-medium">
        </ng-template>
      </div>

      <div class="pt-4">
        <button type="submit" [disabled]="profileForm.invalid || isProfileLoading" class="px-8 py-4 bg-black hover:bg-black/90 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 active:scale-[0.98] flex items-center gap-3 cursor-pointer disabled:opacity-75 disabled:cursor-wait">
          <svg *ngIf="isProfileLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
</section>
