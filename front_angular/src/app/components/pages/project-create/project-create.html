<div class="max-w-4xl mx-auto py-8">
  <!-- Back Link & Header -->
  <div class="mb-8 px-4">
    <a routerLink="/dashboard" 
       class="text-sm font-medium text-gray-500 hover:text-bubblegum transition-colors flex items-center gap-2 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Retour au Dashboard
    </a>
    <h1 class="text-4xl font-bold text-gray-900 mt-4">
      Créer un Nouveau Projet
    </h1>
  </div>

  <!-- Main Form Box -->
  <form [formGroup]="projectForm" (submit)="submitForm($event)" class="px-4">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 space-y-8">
      
      <!-- Nom du projet -->
      <div class="space-y-2">
        <label for="name" class="block text-sm font-semibold text-gray-700">Nom du projet</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </div>
          <input type="text" id="name" formControlName="title" required
                 class="block w-full pl-11 pr-4 py-4 bg-gray-50 border-transparent focus:border-bubblegum focus:bg-white focus:ring-0 rounded-2xl text-gray-900 placeholder-gray-400 transition-all font-medium"
                 placeholder="Ex: Refonte du site web">
        </div>
      </div>

      <!-- Description -->
      <div class="space-y-2">
        <label for="description" class="block text-sm font-semibold text-gray-700">Description</label>
        <textarea id="description" formControlName="description" rows="3"
                  class="block w-full px-4 py-4 bg-gray-50 border-transparent focus:border-bubblegum focus:bg-white focus:ring-0 rounded-2xl text-gray-900 placeholder-gray-400 transition-all font-medium resize-none"
                  placeholder="Décrivez brièvement les objectifs du projet..."></textarea>
      </div>

      <!-- Identité visuelle -->
      <app-project-visual-identity
        [initialColor]="projectColor"
        [initialIconType]="projectIconType"
        [initialIconData]="projectIconData"
        (colorChanged)="onColorChanged($event)"
        (iconChanged)="onIconChanged($event)">
      </app-project-visual-identity>

      <hr class="border-gray-100">

      <!-- Inviter des membres -->
      <app-project-members-invite
        [invites]="invites"
        [userEmail]="authService.currentUser()?.email || ''"
        (inviteAdded)="onInviteAdded($event)"
        (memberRemoved)="onMemberRemoved($event)"
        (roleChanged)="onRoleChanged($event)">
      </app-project-members-invite>

    </div>

    <!-- Action buttons -->
    <div class="mt-8 flex items-center justify-end gap-4 px-4">
      @if (errorMessage()) {
        <div class="text-red-500 font-semibold text-sm mr-auto">{{ errorMessage() }}</div>
      }
      <a routerLink="/dashboard"
         class="px-8 py-4 bg-white border border-gray-200 text-gray-900 font-bold rounded-2xl hover:bg-gray-50 transition-all active:scale-95 cursor-pointer">
        Annuler
      </a>
      <button type="submit" [disabled]="isSubmitting() || projectForm.invalid"
              class="px-10 py-4 bg-bubblegum text-white font-bold rounded-2xl hover:brightness-105 transition-all shadow-lg shadow-bubblegum/20 active:scale-95 flex items-center gap-3 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isSubmitting()) {
          <span class="animate-spin">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </span>
        }
        Créer le projet
      </button>
    </div>
  </form>
</div>
