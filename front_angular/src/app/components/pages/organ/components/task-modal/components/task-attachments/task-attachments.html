<div class="space-y-4">
    <h3 class="text-xs font-black uppercase tracking-widest text-gray-400 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
        </svg>
        Pièces jointes
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div *ngFor="let att of attachments" class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-2xl group shadow-sm hover:shadow transition-shadow">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-slate-50 flex items-center justify-center border border-slate-100 shrink-0">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="text-xs font-bold text-gray-900 truncate cursor-pointer hover:underline" 
                          (click)="downloadAttachment(att.uuid)" 
                          [title]="att.fileName">{{ att.fileName }}</span>
                    <span class="text-[9px] text-gray-400 font-medium">{{ formatSize(att.fileSize) }}</span>
                </div>
            </div>
            <button *ngIf="canDeleteAttachment" 
                    (click)="deleteAttachment(att.uuid)" 
                    type="button" 
                    class="p-2 text-gray-300 hover:text-rose-500 transition-colors opacity-0 group-hover:opacity-100 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Uploading Progress Bar -->
    <div *ngIf="isUploading()" class="p-6 rounded-3xl space-y-3"
         [style.backgroundColor]="highlightColor + '1a'"
         [style.borderColor]="highlightColor + '33'"
         style="border-width: 1px;">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 rounded-xl flex items-center justify-center animate-pulse text-white"
                     [style.backgroundColor]="highlightColor">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <span class="text-xs font-bold truncate" [style.color]="highlightColor">{{ uploadFileName }}</span>
            </div>
        </div>
        <div class="w-full h-2 rounded-full overflow-hidden" [style.backgroundColor]="highlightColor + '1a'">
            <div class="h-full bg-loading transition-all duration-300 ease-out" 
                 [style.width]="'100%'"
                 [style.backgroundColor]="highlightColor"></div>
        </div>
    </div>

    <div *ngIf="canAddAttachment" class="relative">
        <input type="file" (change)="uploadFile($event)" class="hidden" id="task-file-input">
        <label for="task-file-input" 
               class="w-full py-6 flex flex-col items-center justify-center bg-white border-2 border-dashed border-gray-100 rounded-[2rem] text-gray-400 hover:text-[var(--highlight-color)] hover:border-[var(--highlight-color)]/30 hover:bg-[var(--highlight-color)]/[0.02] transition-all cursor-pointer group" 
               [style.--highlight-color]="highlightColor">
            <svg class="w-8 h-8 mb-2 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <span class="text-xs font-bold uppercase tracking-widest">Glisser ou cliquer pour envoyer</span>
        </label>
    </div>
</div>
