<div class="space-y-6">
    <h3 class="text-xs font-black uppercase tracking-widest text-gray-400 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
        Commentaires
    </h3>
    
    <div class="space-y-6">
        <div *ngFor="let c of comments" class="flex gap-4 group/comment">
            <div class="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center text-[10px] font-black uppercase text-gray-500 shrink-0">
                {{ c.user.firstName[0] }}{{ c.user.lastName[0] }}
            </div>
            <div class="flex-grow space-y-1">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-900 truncate max-w-[150px]" [title]="c.user.firstName + ' ' + c.user.lastName">
                            {{ c.user.firstName }} {{ c.user.lastName }}
                        </span>
                        <span class="text-[10px] font-bold text-gray-400">{{ formatDateString(c.createdAt) }}</span>
                    </div>
                    <button *ngIf="canDeleteComment(c)"
                            (click)="onDeleteComment(c.uuid)"
                            type="button" 
                            class="opacity-0 group-hover/comment:opacity-100 p-1.5 text-gray-400 hover:text-rose-500 transition-all cursor-pointer">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
                <div class="p-4 bg-white border border-gray-100 rounded-2xl text-xs text-gray-600 leading-relaxed shadow-sm">
                    {{ c.content }}
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Comment Box -->
    <div *ngIf="canAddComment" class="p-4 bg-white border border-gray-100 rounded-2xl space-y-4">
        <textarea #newCommentText rows="3" placeholder="Écrire un commentaire..." 
                  class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:bg-white border border-transparent focus:border-[var(--highlight-color)] transition-all resize-none shadow-inner" 
                  [style.--highlight-color]="highlightColor"></textarea>
        <div class="flex justify-end">
            <button (click)="onAddComment(newCommentText)" 
                    class="px-8 py-3 bg-black text-white text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-black/90 active:scale-95 transition-all shadow-lg cursor-pointer">
                Envoyer
            </button>
        </div>
    </div>
</div>
