<div class="relative">
    <button (click)="toggleFilterMenu()"
            class="px-5 py-3 bg-white border border-gray-100 rounded-2xl text-sm font-bold text-gray-700 hover:bg-gray-50 transition-all shadow-sm cursor-pointer group flex items-center gap-2">
        <svg class="w-4 h-4 text-gray-400 group-hover:text-[var(--highlight-color)] transition-colors" [style.--highlight-color]="highlightColor" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
        Filtrer
    </button>

    <!-- Floating Filter Menu -->
    <div *ngIf="showFilterMenu()" 
         class="absolute right-0 lg:left-0 mt-3 w-72 bg-white rounded-[2rem] shadow-2xl border border-gray-100 p-6 z-50 animate-in fade-in slide-in-from-top-2 duration-200">
        <div class="space-y-6">
            <!-- Sorting -->
            <div>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-4 ml-1">Trier par</p>
                <div class="grid grid-cols-1 gap-2">
                    <button (click)="setSort('priority')" class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-gray-50 transition-colors flex items-center justify-between group/item cursor-pointer">
                        Priorité
                        <span [class.hidden]="sortBy !== 'priority'" class="text-[var(--highlight-color)] transition-transform duration-200" [style.--highlight-color]="highlightColor" [style.transform]="sortOrder === 'asc' ? 'rotate(180deg)' : ''">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                        </span>
                    </button>
                    <button (click)="setSort('dueDate')" class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-gray-50 transition-colors flex items-center justify-between group/item cursor-pointer">
                        Date d'échéance
                        <span [class.hidden]="sortBy !== 'dueDate'" class="text-[var(--highlight-color)] transition-transform duration-200" [style.--highlight-color]="highlightColor" [style.transform]="sortOrder === 'asc' ? 'rotate(180deg)' : ''">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                        </span>
                    </button>
                    <button (click)="setSort('date')" class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-gray-50 transition-colors flex items-center justify-between group/item cursor-pointer">
                        Date de création
                        <span [class.hidden]="sortBy !== 'date'" class="text-[var(--highlight-color)] transition-transform duration-200" [style.--highlight-color]="highlightColor" [style.transform]="sortOrder === 'asc' ? 'rotate(180deg)' : ''">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                        </span>
                    </button>
                </div>
            </div>

            <!-- Filtering -->
            <div>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-4 ml-1">Filtrer par</p>
                <div class="space-y-3">
                    <label class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors group">
                        <div class="relative flex items-center">
                            <input type="checkbox" [ngModel]="filterMe" (ngModelChange)="onFilterMeChange($event)" class="peer h-5 w-5 cursor-pointer appearance-none rounded-lg border-2 border-gray-200 transition-all checked:border-[var(--highlight-color)] checked:bg-[var(--highlight-color)]" [style.--highlight-color]="highlightColor">
                            <svg class="absolute left-1 top-1 h-3 w-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <span class="text-xs font-bold text-gray-600 group-hover:text-black">Me concerne</span>
                    </label>

                    <!-- Min Priority filter -->
                    <div class="pt-2">
                        <p class="text-[9px] font-bold text-gray-300 uppercase tracking-tight mb-2 ml-4">Priorité minimale</p>
                        <div class="flex px-4 gap-1">
                            <button *ngFor="let p of [1,2,3,4,5]" 
                                    (click)="setPriorityFilter(p)" 
                                    class="flex-1 py-2 rounded-lg text-[10px] font-black border-2 transition-all cursor-pointer"
                                    [class.border-gray-100]="minPriority !== p"
                                    [class.hover:border-gray-200]="minPriority !== p"
                                    [class.text-white]="minPriority === p"
                                    [style.backgroundColor]="minPriority === p ? highlightColor : ''"
                                    [style.borderColor]="minPriority === p ? highlightColor : ''">
                                {{ p }}
                            </button>
                        </div>
                    </div>

                    <!-- Status selection filters -->
                    <div class="pt-2">
                        <p class="text-[9px] font-bold text-gray-300 uppercase tracking-tight mb-2 ml-4">Statut</p>
                        <div class="flex flex-wrap px-4 gap-2">
                            <button *ngFor="let s of [
                                        {id: 'TODO', label: 'À faire'},
                                        {id: 'IN_PROGRESS', label: 'En cours'},
                                        {id: 'WAITING', label: 'En attente'},
                                        {id: 'DONE', label: 'Terminé'},
                                        {id: 'CANCELED', label: 'Annulé'}
                                    ]"
                                    (click)="toggleStatusFilter(s.id)"
                                    class="px-3 py-1.5 rounded-lg text-[9px] font-black border-2 transition-all uppercase tracking-wider cursor-pointer"
                                    [class.border-gray-100]="!selectedStatuses.includes(s.id)"
                                    [class.hover:border-gray-200]="!selectedStatuses.includes(s.id)"
                                    [class.text-white]="selectedStatuses.includes(s.id)"
                                    [style.backgroundColor]="selectedStatuses.includes(s.id) ? highlightColor : ''"
                                    [style.borderColor]="selectedStatuses.includes(s.id) ? highlightColor : ''">
                                {{ s.label }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reset -->
            <div class="pt-4 border-t border-gray-50">
                <button (click)="reset()" class="w-full py-3 rounded-2xl bg-gray-50 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-all cursor-pointer">
                    Réinitialiser
                </button>
            </div>
        </div>
    </div>
</div>
