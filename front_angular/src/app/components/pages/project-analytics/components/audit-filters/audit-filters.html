<div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-xs mb-10 space-y-5">
  <div class="flex items-center justify-between border-b border-gray-100 pb-3">
    <div class="flex items-center gap-2.5">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5" [style.color]="getProjectColorHex()">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
      </svg>
      <h3 class="text-sm font-black text-gray-900 uppercase tracking-widest">Affiner les actions visibles</h3>
    </div>
    <div class="flex gap-2">
      <button type="button" 
              (click)="selectAll.emit(true)" 
              class="text-[10px] font-bold text-gray-500 hover:text-black transition-colors uppercase tracking-wider bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded-xl cursor-pointer">
        Tout cocher
      </button>
      <button type="button" 
              (click)="selectAll.emit(false)" 
              class="text-[10px] font-bold text-gray-500 hover:text-black transition-colors uppercase tracking-wider bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded-xl cursor-pointer">
        Tout décocher
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Group 1: Modifications -->
    <div class="lg:col-span-2 space-y-3">
      <div class="flex items-center justify-between border-b border-gray-50 pb-1.5">
        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Modifications (Écritures actives)</span>
        <button type="button"
                (click)="toggleGroup.emit({ group: 'modifications', state: !isModificationsSelected })"
                class="text-[9px] font-bold text-bubblegum hover:opacity-80 transition-opacity uppercase tracking-wider cursor-pointer"
                [style.color]="getProjectColorHex()">
          {{ isModificationsSelected ? 'Décocher le groupe' : 'Cocher le groupe' }}
        </button>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['CREATE']" 
                 (ngModelChange)="toggleAction.emit('CREATE')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Créations de tâches
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['UPDATE']" 
                 (ngModelChange)="toggleAction.emit('UPDATE')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Mises à jour & Éditions
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['STATUS_CHANGE']" 
                 (ngModelChange)="toggleAction.emit('STATUS_CHANGE')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Changements de statut
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['COMMENT_ADD']" 
                 (ngModelChange)="toggleAction.emit('COMMENT_ADD')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Ajouts de commentaires
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['ATTACHMENT_ADD']" 
                 (ngModelChange)="toggleAction.emit('ATTACHMENT_ADD')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Ajouts de pièces jointes
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['ASSIGNEE']" 
                 (ngModelChange)="toggleAction.emit('ASSIGNEE')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Affectation de membres
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['HARD_DELETE']" 
                 (ngModelChange)="toggleAction.emit('HARD_DELETE')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Suppressions définitives
        </label>
      </div>
    </div>

    <!-- Group 2: Consultations -->
    <div class="space-y-3">
      <div class="flex items-center justify-between border-b border-gray-50 pb-1.5">
        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Consultations (Lectures)</span>
        <button type="button"
                (click)="toggleGroup.emit({ group: 'consultations', state: !isConsultationsSelected })"
                class="text-[9px] font-bold text-bubblegum hover:opacity-80 transition-opacity uppercase tracking-wider cursor-pointer"
                [style.color]="getProjectColorHex()">
          {{ isConsultationsSelected ? 'Décocher' : 'Cocher' }}
        </button>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-1 gap-3">
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['PROJECT_VIEW']" 
                 (ngModelChange)="toggleAction.emit('PROJECT_VIEW')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Vues globales du projet
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['ORGAN_VIEW']" 
                 (ngModelChange)="toggleAction.emit('ORGAN_VIEW')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Vues des organes
        </label>
        <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
          <input type="checkbox" 
                 [ngModel]="visibleActions['TASK_VIEW']" 
                 (ngModelChange)="toggleAction.emit('TASK_VIEW')"
                 class="w-4 h-4 rounded text-bubblegum focus:ring-bubblegum/20 border-gray-300 cursor-pointer"
                 [style.color]="getProjectColorHex()">
          Vues des tâches
        </label>
      </div>
    </div>
  </div>
</div>
