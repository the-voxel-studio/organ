<div class="mb-10">
  <h1 class="text-3xl font-black text-black mb-2">Bon retour !</h1>
  <p class="text-gray-500 font-medium">Accédez à votre espace de travail.</p>
</div>

<!-- Error Zone -->
@if (errorMessage()) {
  <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm font-bold rounded-r-xl">
    <span>{{ errorMessage() }}</span>
  </div>
}

<!-- Success Zone (Registration) -->
@if (successMessage()) {
  <div class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm font-bold rounded-r-xl">
    <span>{{ successMessage() }}</span>
  </div>
}

<form (submit)="onSubmit(); $event.preventDefault()">
  <div class="space-y-6">
    <!-- Email -->
    <div>
      <label for="username" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-widest">Adresse E-mail</label>
      <input type="email" 
             [(ngModel)]="email" 
             name="email" 
             id="username" 
             class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum focus:ring-4 focus:ring-bubblegum/10 transition-all outline-none" 
             autocomplete="email" 
             required 
             autofocus 
             placeholder="nom@exemple.com">
    </div>

    <!-- Password -->
    <div class="relative">
      <div class="flex justify-between items-center mb-2">
        <label for="password" class="block text-sm font-bold text-gray-700 uppercase tracking-widest">Mot de passe</label>
        <a routerLink="/login" class="text-xs font-bold text-bubblegum hover:text-bubblegum/80 transition-colors">Mot de passe oublié ?</a>
      </div>
      <div class="relative">
        <input [type]="showPassword() ? 'text' : 'password'" 
               [(ngModel)]="password" 
               name="password" 
               id="password" 
               class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-bubblegum focus:ring-4 focus:ring-bubblegum/10 transition-all outline-none" 
               autocomplete="current-password" 
               required 
               placeholder="••••••••">
        <button type="button" 
                (click)="togglePasswordVisibility()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black transition-colors p-2 cursor-pointer">
          @if (showPassword()) {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Agreement -->
    <div class="flex items-center justify-center py-2">
      <label class="relative flex items-center group cursor-pointer">
        <input type="checkbox" 
               id="agreement" 
               [(ngModel)]="agreement" 
               name="agreement" 
               class="peer sr-only">
        
        <!-- Custom Checkbox -->
        <div class="w-5 h-5 border-2 border-gray-300 rounded-md bg-white transition-all duration-200 
                    peer-checked:bg-bubblegum peer-checked:border-bubblegum 
                    peer-focus:ring-2 peer-focus:ring-bubblegum/20
                    group-hover:border-bubblegum/50 flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>

        <!-- Label Text (Full Legal Version) -->
        <span class="ml-3 text-[11px] font-bold text-gray-400 uppercase tracking-widest leading-relaxed select-none group-hover:text-gray-600 transition-colors">
          J'accepte les 
          <a routerLink="/terms" class="text-bubblegum hover:underline decoration-2 underline-offset-4 transition-all">
            Conditions d'Utilisation
          </a>
           et la 
          <a routerLink="/privacy-policy" class="text-bubblegum hover:underline decoration-2 underline-offset-4 transition-all">
            Politique de Confidentialité
          </a>
        </span>
      </label>
    </div>

    <button type="submit" 
            [disabled]="isLoading()"
            class="w-full py-4 bg-bubblegum hover:bg-bubblegum/90 text-white font-black text-lg rounded-2xl shadow-xl shadow-bubblegum/20 transition-all transform hover:-translate-y-1 active:scale-[0.98] uppercase tracking-widest cursor-pointer flex items-center justify-center gap-3 disabled:opacity-50">
      @if (isLoading()) {
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      }
      <span>Se connecter</span>
    </button>
  </div>
</form>

<!-- Separator -->
<div class="relative my-10">
  <div class="absolute inset-0 flex items-center">
    <div class="w-full border-t border-gray-100"></div>
  </div>
  <div class="relative flex justify-center text-sm">
    <span class="px-4 bg-white text-gray-400 font-bold uppercase tracking-widest text-[10px]">Ou continuer avec</span>
  </div>
</div>

<!-- Social Login -->
<div class="relative mb-10 flex justify-center">
  <!-- Hidden official Google button to handle security -->
  <div #googleBtnContainer class="hidden">
    <asl-google-signin-button type="standard" size="large" [width]="384"></asl-google-signin-button>
  </div>
  
  <!-- Custom styled button -->
  <button type="button" 
          (click)="triggerGoogleLogin()" 
          [disabled]="isLoading()"
          class="w-full flex items-center justify-center gap-3 py-4 bg-white border-2 border-gray-100 rounded-2xl font-bold text-gray-700 hover:bg-gray-50 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-wait">
      
      @if (isLoading()) {
        <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      } @else {
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      }
      <span>Se connecter avec Google</span>
  </button>
</div>

<p class="text-center text-gray-500 font-medium">
  Pas encore de compte ? 
  <a routerLink="/register" class="text-bubblegum font-black hover:underline decoration-2 underline-offset-4 transition-all">Créer un compte</a>
</p>
