<div class="max-w-4xl mx-auto py-8">
  <!-- Back Link & Header -->
  <div class="mb-8 px-4">
    <a [routerLink]="['/project', projectUuid]" 
       class="text-sm font-medium text-gray-500 hover:text-bubblegum transition-colors flex items-center gap-2 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Retour au Projet
    </a>
    <h1 class="text-4xl font-bold text-gray-900 mt-4">
      Paramètres du Projet
    </h1>
  </div>

  @if (isLoading()) {
    <!-- Loading State -->
    <div class="flex flex-col items-center justify-center min-h-[300px]">
      <div class="w-12 h-12 border-4 border-bubblegum border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-500 font-medium">Chargement des paramètres...</p>
    </div>
  } @else {
    <div class="px-4">
      <app-project-form
        [isEdit]="true"
        [isSubmitting]="isSubmitting()"
        [errorMessage]="errorMessage()"
        [userEmail]="authService.currentUser()?.email || ''"
        [projectUuid]="projectUuid"
        [initialProjectData]="initialProjectData"
        [initialInvites]="initialInvites"
        (submitForm)="onSubmitForm($event)"
        (cancel)="onCancel()">
      </app-project-form>
    </div>

    <!-- Google Drive extension (admin only) -->
    @if (userRole === 'ADMIN') {
      <app-project-google-drive
        [projectUuid]="projectUuid!"
        [projectTitle]="projectTitle"
        [googleClientId]="googleClientId">
      </app-project-google-drive>
    }

    <!-- Danger Zone -->
    <app-project-danger-zone
      [projectUuid]="projectUuid!"
      [projectTitle]="projectTitle"
      (deleted)="onProjectDeleted()">
    </app-project-danger-zone>
  }
</div>
