<section class="mb-12">
  <button type="button" (click)="toggleSection()"
          class="w-full flex items-center justify-between mb-6 group cursor-pointer focus:outline-none">
    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-gray-400 flex items-center gap-3">
      <span class="w-8 h-[1px] bg-gray-100"></span>
      Organes supprimés ({{ filteredOrgans().length }})
    </h2>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" 
         class="w-4 h-4 text-gray-300 group-hover:text-black transition-all transform duration-200" 
         [class.rotate-0]="!organsCollapsed()" [class.-rotate-90]="organsCollapsed()">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>
  
  @if (!organsCollapsed()) {
    <div class="space-y-4 animate-in fade-in duration-200">
      @for (organ of filteredOrgans(); track organ.uuid) {
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between gap-6 hover:shadow-md transition-shadow">
          <div class="flex items-center gap-6 min-w-0">
            <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-500 shrink-0 border border-indigo-100">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
              </svg>
            </div>
            <div class="min-w-0">
              <h3 class="text-lg font-bold text-black truncate">{{ organ.title }}</h3>
              <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest mt-1">
                Supprimé le {{ formatDate(organ.deletedAt) }}
              </p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" (click)="restore.emit(organ)"
                    class="px-5 py-2.5 bg-black text-white text-xs font-black uppercase tracking-widest rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
              Restaurer
            </button>
            <button type="button" (click)="hardDelete.emit(organ)"
                    class="p-2.5 bg-rose-50 text-rose-500 rounded-xl hover:bg-rose-100 active:scale-95 transition-all cursor-pointer"
                    title="Supprimer définitivement">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </button>
          </div>
        </div>
      } @empty {
        <p class="text-xs text-gray-400 italic text-center p-4">Aucun organe ne correspond à votre recherche.</p>
      }
    </div>
  }
</section>
