<div *ngIf="isOpen" class="fixed inset-0 z-[100] overflow-y-auto">
  <!-- Overlay with blur -->
  <div class="fixed inset-0 bg-black/20 backdrop-blur-md transition-opacity" (click)="onCancel()"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-100">
      <div class="bg-white px-8 pb-8 pt-10">
        <div class="sm:flex sm:items-start">
          <!-- Dynamic Icon based on Type -->
          <div [ngClass]="{
                 'bg-red-50 text-red-600': type === 'danger',
                 'bg-yellow-50 text-yellow-600': type === 'warning',
                 'bg-highlight/10 text-highlight': type === 'primary' || type === 'info'
               }"
               class="mx-auto flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl sm:mx-0">
            
            <!-- Danger / Warning Icon -->
            <svg *ngIf="type === 'danger' || type === 'warning'" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
            </svg>
            
            <!-- Info / Primary Icon -->
            <svg *ngIf="type === 'primary' || type === 'info'" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/>
            </svg>
          </div>

          <div class="mt-4 text-center sm:ml-6 sm:mt-0 sm:text-left">
            <h3 class="text-2xl font-black text-black leading-6">{{ title }}</h3>
            <div class="mt-4 space-y-4">
              <!-- Render HTML safely inside innerHTML -->
              <div class="text-sm font-medium text-gray-500 leading-relaxed" [innerHTML]="message"></div>
              
              <!-- Info Box (if parameters provided) -->
              <div *ngIf="infoTitle && infoText" class="p-4 bg-highlight/5 rounded-2xl border border-highlight/10">
                <p class="text-xs font-bold text-highlight uppercase tracking-wider mb-1">{{ infoTitle }}</p>
                <p class="text-xs font-medium text-highlight/80 leading-snug">{{ infoText }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Footer actions -->
      <div class="bg-gray-50/50 px-8 py-6 flex flex-col sm:flex-row-reverse gap-3">
        <button type="button" 
                (click)="onConfirm()"
                [disabled]="isLoading"
                [ngClass]="{
                  'bg-red-600 hover:bg-red-500 shadow-red-200': type === 'danger',
                  'bg-yellow-600 hover:bg-yellow-500 shadow-yellow-100': type === 'warning',
                  'bg-black hover:bg-gray-800 shadow-gray-200': type === 'primary' || type === 'info'
                }"
                class="inline-flex w-full justify-center items-center gap-2 rounded-2xl px-6 py-4 text-sm font-black text-white shadow-xl transition-all sm:w-auto cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          
          <svg *ngIf="isLoading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          
          {{ confirmLabel }}
        </button>
        <button type="button" 
                (click)="onCancel()"
                [disabled]="isLoading"
                class="inline-flex w-full justify-center rounded-2xl bg-white px-6 py-4 text-sm font-bold text-gray-900 border border-gray-200 hover:bg-gray-50 transition-all sm:w-auto cursor-pointer disabled:opacity-50">
          {{ cancelLabel }}
        </button>
      </div>
    </div>
  </div>
</div>
