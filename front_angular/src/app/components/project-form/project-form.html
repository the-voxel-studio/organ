<form [formGroup]="projectForm" (submit)="onSubmit($event)" class="space-y-8">
  <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 space-y-8">
    
    <!-- Nom du projet -->
    <div class="space-y-2">
      <label for="name" class="block text-sm font-semibold text-gray-700">Nom du projet</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <input type="text" id="name" formControlName="title" required
               class="block w-full pl-11 pr-4 py-4 bg-gray-50 border-transparent focus:border-bubblegum focus:bg-white focus:ring-0 rounded-2xl text-gray-900 placeholder-gray-400 transition-all font-medium border border-transparent focus:border-gray-200 outline-none"
               placeholder="Ex: Refonte du site web">
      </div>
    </div>

    <!-- Description -->
    <div class="space-y-2">
      <label for="description" class="block text-sm font-semibold text-gray-700">Description</label>
      <textarea id="description" formControlName="description" rows="3"
                class="block w-full px-4 py-4 bg-gray-50 border border-transparent focus:border-gray-200 focus:bg-white focus:ring-0 rounded-2xl text-gray-900 placeholder-gray-400 transition-all font-medium resize-none outline-none"
                placeholder="Décrivez brièvement les objectifs du projet..."></textarea>
    </div>

    <!-- Statut (Uniquement en mode édition) -->
    @if (isEdit) {
      <div class="space-y-2">
        <label for="status" class="block text-sm font-semibold text-gray-700">Statut du projet</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <select id="status" formControlName="status"
                  class="block w-full pl-11 pr-10 py-4 bg-gray-50 border-transparent focus:border-bubblegum focus:bg-white focus:ring-0 rounded-2xl text-gray-900 font-medium appearance-none transition-all cursor-pointer border border-transparent focus:border-gray-200 outline-none">
            <option value="ACTIVE">Actif</option>
            <option value="ARCHIVED">Archivé</option>
            <option value="INACTIVE">Inactif</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
    }

    <!-- Identité visuelle -->
    <app-project-visual-identity class="block"
      [initialColor]="projectColor"
      [initialIconType]="projectIconType"
      [initialIconData]="projectIconData"
      (colorChanged)="onColorChanged($event)"
      (iconChanged)="onIconChanged($event)">
    </app-project-visual-identity>

    <hr class="border-gray-100">

    <!-- Inviter des membres -->
    <app-project-members-invite class="block"
      [invites]="invites"
      [userEmail]="userEmail"
      (inviteAdded)="onInviteAdded($event)"
      (memberRemoved)="onMemberRemoved($event)"
      (roleChanged)="onRoleChanged($event)">
    </app-project-members-invite>

  </div>

  <!-- Action buttons -->
  <div class="mt-8 flex items-center justify-end gap-4">
    @if (errorMessage) {
      <div class="text-red-500 font-semibold text-sm mr-auto">{{ errorMessage }}</div>
    }
    
    <button type="button" (click)="onCancel()"
            class="px-8 py-4 bg-white border border-gray-200 text-gray-900 font-bold rounded-2xl hover:bg-gray-50 transition-all active:scale-95 cursor-pointer">
      Annuler
    </button>
    
    <button type="submit" [disabled]="isSubmitting || projectForm.invalid"
            class="px-10 py-4 bg-bubblegum text-white font-bold rounded-2xl hover:brightness-105 transition-all shadow-lg shadow-bubblegum/20 active:scale-95 flex items-center gap-3 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      @if (isSubmitting) {
        <span class="animate-spin">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        </span>
      }
      {{ isEdit ? 'Mettre à jour le projet' : 'Créer le projet' }}
    </button>
  </div>
</form>
