<router-outlet></router-outlet>

<!-- Custom mutualized toast notifications -->
<div class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 w-full max-w-sm pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex items-start gap-3 p-4 bg-white/90 backdrop-blur-md border border-gray-100 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-0 scale-100 animate-in slide-in-from-right-5 duration-300"
         [class.border-red-100]="toast.type === 'error'"
         [class.border-green-100]="toast.type === 'success'"
         [class.border-amber-100]="toast.type === 'warning'">
      
      <!-- Icon depending on type -->
      @if (toast.type === 'error') {
        <div class="p-2 bg-rose-50 text-rose-500 rounded-xl shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
      } @else if (toast.type === 'success') {
        <div class="p-2 bg-emerald-50 text-emerald-500 rounded-xl shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      } @else if (toast.type === 'warning') {
        <div class="p-2 bg-amber-50 text-amber-500 rounded-xl shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
      } @else {
        <div class="p-2 bg-blue-50 text-blue-500 rounded-xl shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      }

      <div class="flex-grow min-w-0">
        <h4 class="text-xs font-black text-gray-900 uppercase tracking-wider leading-none mb-1">{{ toast.title }}</h4>
        <p class="text-xs text-gray-500 font-medium leading-relaxed">{{ toast.message }}</p>
      </div>

      <button (click)="toastService.clear(toast.id)" class="p-1 text-gray-300 hover:text-gray-500 transition-colors shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  }
</div>
