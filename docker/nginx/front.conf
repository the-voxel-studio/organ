server {
    listen 80;
    server_name localhost;
    
    root /var/www/html/public;
    index index.php;

    # Augmente la taille max autorisée par Nginx
    client_max_body_size 120M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location /api {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api organ_api_nginx;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Augmente les timeouts pour l'API (10 minutes)
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }

    location /hub {
        proxy_pass http://mercure/.well-known/mercure;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/index\.php(/|$) {
        # ATTENTION : Ici on pointe vers le conteneur du Front
        fastcgi_pass organ_front_php:9000;
        
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Augmente le timeout pour éviter les erreurs 504 (10 minutes)
        fastcgi_read_timeout 600;
        
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}